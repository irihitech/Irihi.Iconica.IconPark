name: Release Tag

on:
  workflow_dispatch:
    inputs:
      Upload_to_NuGet:
        description: 'Upload to NuGet'
        default: false
        type: boolean
      Irihi_Iconica_IconPark:
        description: 'Pack Irihi.Iconica.IconPark'
        default: true
        type: boolean
      Irihi_Iconica_TDesign:
        description: 'Pack Irihi.Iconica.TDesign'
        default: true
        type: boolean

jobs:
  nuget:
    uses: ./.github/workflows/pack.yml
    with:
      Upload_to_NuGet: ${{ inputs.Upload_to_NuGet }}
      Irihi_Iconica_IconPark: ${{ inputs.Irihi_Iconica_IconPark }}
      Irihi_Iconica_TDesign: ${{ inputs.Irihi_Iconica_TDesign }}
    secrets: inherit

  publish:
    uses: ./.github/workflows/publish.yml

  draft-release:
    needs: [ nuget, publish ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8

      - name: Display structure of downloaded files
        run: ls -R

      - name: Zip artifacts
        run: |
          zip -rj Irihi.Iconica.Demo.Desktop.win-x64.zip Irihi.Iconica.Demo.Desktop.win-x64
          cd Irihi.Iconica.Demo.Desktop.win-x64.NativeAOT
          zip -r ../Irihi.Iconica.Demo.Desktop.win-x64.NativeAOT.zip .
          cd "${GITHUB_WORKSPACE}"

      - name: Display structure of zipped files
        run: ls -R

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          draft: true
          files: |
            nugets/*.nupkg
            *.zip
