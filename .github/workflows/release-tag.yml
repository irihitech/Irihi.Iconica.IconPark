name: Release Tag

on:
  workflow_dispatch:
    inputs:
      Tag_Name:
        description: 'Release tag (e.g. TDesign-v1.0.1). Leave empty to use the current ref tag.'
        default: ''
        type: string
      Upload_to_NuGet:
        description: 'Upload to NuGet'
        default: false
        type: boolean
      Irihi_Iconica_Core:
        description: 'Pack Irihi.Iconica.Core'
        default: true
        type: boolean
      Irihi_Iconica_IconPark:
        description: 'Pack Irihi.Iconica.IconPark'
        default: false
        type: boolean
      Irihi_Iconica_TDesign:
        description: 'Pack Irihi.Iconica.TDesign'
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fail when no tag source
        if: github.event_name == 'workflow_dispatch' && inputs.Tag_Name == '' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error::Tag_Name is empty and current ref is not a tag (ref=${{ github.ref }}). Fill in Tag_Name, or run this workflow from a tag."
          exit 1

  nuget:
    needs: validate
    uses: ./.github/workflows/pack.yml
    with:
      Upload_to_NuGet: ${{ inputs.Upload_to_NuGet }}
      Irihi_Iconica_Core: ${{ inputs.Irihi_Iconica_Core }}
      Irihi_Iconica_IconPark: ${{ inputs.Irihi_Iconica_IconPark }}
      Irihi_Iconica_TDesign: ${{ inputs.Irihi_Iconica_TDesign }}
    secrets: inherit

  publish:
    needs: validate
    uses: ./.github/workflows/publish.yml

  draft-release:
    needs: [ nuget, publish ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8

      - name: Display structure of downloaded files
        run: ls -R

      - name: Zip artifacts
        run: |
          zip -rj Irihi.Iconica.Demo.Desktop.win-x64.zip Irihi.Iconica.Demo.Desktop.win-x64
          cd Irihi.Iconica.Demo.Desktop.win-x64.NativeAOT
          zip -r ../Irihi.Iconica.Demo.Desktop.win-x64.NativeAOT.zip .
          cd "${GITHUB_WORKSPACE}"

      - name: Display structure of zipped files
        run: ls -R

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          draft: true
          files: |
            nugets/*.nupkg
            *.zip
          tag_name: ${{ inputs.Tag_Name }}
